name = "university-research-agent"
main = "src/index.js"
compatibility_date = "2026-10-14"
[vars]
MINIMAX_MODEL = "MiniMax-M3"
MINIMAX_API_BASE = "https://api.minimax.cn/v1"
MINIMAX_BILLING_MODE = "token-plan"
# Secret values must be configured by wrangler secret put.

[[durable_objects.bindings]]
name = "RUNS"
class_name = "ResearchRun"

[[migrations]]
tag = "v1-run-state"
new_sqlite_classes = ["ResearchRun"]

[[durable_objects.bindings]]
name = "PROJECTS"
class_name = "ResearchProject"

[[migrations]]
tag = "v2-research-projects"
new_sqlite_classes = ["ResearchProject"]
