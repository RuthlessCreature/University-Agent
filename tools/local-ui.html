<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>科研文档课堂演示</title>
<style>body{font:18px/1.8 'Microsoft YaHei',sans-serif;color:#243442;max-width:960px;margin:70px auto;padding:0 30px;background:#fff}h1{font-size:36px;line-height:1.5;color:#17324d}section{border-top:1px solid #d1d9df;padding:22px 0}button{font:inherit;padding:7px 20px;background:#17324d;color:white;border:0;cursor:pointer}button:disabled{opacity:.5}a{color:#235f85}#result{background:#f0f4f6;padding:20px;margin-top:25px;white-space:pre-wrap}small{color:#596a76}h2{font-size:24px;margin-bottom:5px}</style>
<h1>科研文档课堂演示</h1><p>选一份已经准备好的材料，生成 Word 草稿，再对照来源和问题清单检查。申报与专利材料是教学模拟；论文示例使用公开企鹅数据。</p>
<section><h2>项目申报</h2><p>教学指南与模板已经给定。检查目标和指标的对应关系，保留研究基础、查新与人工签核的缺口。</p><button data-kind="grant">生成申报草稿</button></section>
<section><h2>论文写作</h2><p>按 IMRAD 组织公开数据的描述性分析。结果可复算，不把课堂示例当作新的研究发现。</p><button data-kind="paper">生成论文示例</button></section>
<section><h2>技术交底</h2><p>双传感器告警方案的技术事实尚不完整。草稿会保留参数问题，不补写效果数据。</p><button data-kind="patent">生成交底草稿</button></section>
<div id="result" hidden></div><p><small>本地固定材料演示。当前执行文件检查和文档生成，没有调用外部模型；产物仍需研究者审核。</small></p>
<script>for(const b of document.querySelectorAll('button'))b.onclick=async()=>{b.disabled=true;const out=document.getElementById('result');out.hidden=false;out.textContent='正在读取材料和模板……';try{const r=await fetch('/api/local-run/'+b.dataset.kind,{method:'POST'});const data=await r.json();if(!r.ok)throw Error(data.error||'生成失败');out.textContent='草稿已生成，尚未获得研究者签核。请打开文档末尾的“来源与未决问题”，逐项核对。\n';const link=document.createElement('a');link.href='/artifacts/'+b.dataset.kind;link.textContent='下载可编辑 Word';out.append(link)}catch(e){out.textContent='此次未生成可交付文件：'+e.message}finally{b.disabled=false}};</script></html>
