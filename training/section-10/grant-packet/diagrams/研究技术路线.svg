<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6" fill="#245B77"/></marker></defs><rect width="1600" height="700" fill="white"/><text x="80" y="55" font-family="Microsoft YaHei" font-size="34" fill="#132F43">分步提示与独立解题：拟议技术路线</text><text x="80" y="102" font-family="Microsoft YaHei" font-size="24" fill="#627681">教学拟议，未实施；箭头表示执行次序和后续测量，不表示因果效应。</text><g data-node="materials"><rect x="80" y="140" width="350" height="85" fill="#F0F5F8" stroke="#245B77" stroke-width="1.5"/><text x="95" y="192.5" font-family="Microsoft YaHei" font-size="29" fill="#132F43">题目与评分规则</text></g><g data-node="pilot"><rect x="80" y="295" width="350" height="110" fill="#F0F5F8" stroke="#245B77" stroke-width="1.5"/><text x="95" y="360" font-family="Microsoft YaHei" font-size="29" fill="#132F43">材料预试与分配安排</text></g><g data-node="step"><rect x="610" y="150" width="400" height="85" fill="#F0F5F8" stroke="#245B77" stroke-width="1.5"/><text x="625" y="202.5" font-family="Microsoft YaHei" font-size="29" fill="#132F43">分步提示条件</text></g><g data-node="answer"><rect x="610" y="420" width="400" height="85" fill="#F0F5F8" stroke="#245B77" stroke-width="1.5"/><text x="625" y="472.5" font-family="Microsoft YaHei" font-size="29" fill="#132F43">完整解答条件</text></g><g data-node="process1"><rect x="610" y="265" width="400" height="85" fill="#F0F5F8" stroke="#245B77" stroke-width="1.5"/><text x="625" y="317.5" font-family="Microsoft YaHei" font-size="29" fill="#132F43">提示组过程记录</text></g><g data-node="process2"><rect x="610" y="535" width="400" height="70" fill="#F0F5F8" stroke="#245B77" stroke-width="1.5"/><text x="625" y="580" font-family="Microsoft YaHei" font-size="29" fill="#132F43">解答组过程记录</text></g><g data-node="test"><rect x="1180" y="290" width="340" height="110" fill="#F0F5F8" stroke="#245B77" stroke-width="1.5"/><text x="1195" y="337" font-family="Microsoft YaHei" font-size="29" fill="#132F43">一周后无AI新题</text><text x="1195" y="373" font-family="Microsoft YaHei" font-size="29" fill="#132F43">按统一规则评分</text></g><g data-node="compare"><rect x="1180" y="510" width="340" height="85" fill="#F0F5F8" stroke="#245B77" stroke-width="1.5"/><text x="1195" y="562.5" font-family="Microsoft YaHei" font-size="29" fill="#132F43">按预定方案比较</text></g><polyline data-source="materials" data-target="pilot" points="255,225 255,295" fill="none" stroke="#245B77" stroke-width="2" marker-end="url(#arrow)"/><polyline data-source="pilot" data-target="step" points="430,350 520,350 520,192.5 610,192.5" fill="none" stroke="#245B77" stroke-width="2" marker-end="url(#arrow)"/><polyline data-source="pilot" data-target="answer" points="430,350 520,350 520,462.5 610,462.5" fill="none" stroke="#245B77" stroke-width="2" marker-end="url(#arrow)"/><polyline data-source="step" data-target="process1" points="810,235 810,265" fill="none" stroke="#245B77" stroke-width="2" marker-end="url(#arrow)"/><polyline data-source="answer" data-target="process2" points="810,505 810,535" fill="none" stroke="#245B77" stroke-width="2" marker-end="url(#arrow)"/><polyline data-source="process1" data-target="test" points="1010,307.5 1095,307.5 1095,345 1180,345" fill="none" stroke="#245B77" stroke-width="2" marker-end="url(#arrow)"/><polyline data-source="process2" data-target="test" points="1010,570 1095,570 1095,345 1180,345" fill="none" stroke="#245B77" stroke-width="2" marker-end="url(#arrow)"/><polyline data-source="test" data-target="compare" points="1350,400 1350,510" fill="none" stroke="#245B77" stroke-width="2" marker-end="url(#arrow)"/><text x="80" y="498" font-family="Microsoft YaHei" font-size="24" fill="#263D4A">用同一编号对应组别、过程与测验；</text><text x="80" y="530" font-family="Microsoft YaHei" font-size="24" fill="#263D4A">测量缺失和执行偏离单独登记。</text></svg>