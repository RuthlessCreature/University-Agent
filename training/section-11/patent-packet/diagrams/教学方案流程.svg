<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6" fill="#245B77"/></marker></defs><rect width="1600" height="700" fill="white"/><text x="80" y="55" font-family="Microsoft YaHei" font-size="34" fill="#132F43">离心机传感数据检查 教学假设方案</text><text x="80" y="102" font-family="Microsoft YaHei" font-size="24" fill="#627681">箭头仅表示拟议信息路径；安装、阈值、接口、处理与恢复规则均待提供。</text><g data-node="input"><rect x="80" y="140" width="390" height="95" fill="#F0F5F8" stroke="#245B77" stroke-width="1.5"/><text x="95" y="197.5" font-family="Microsoft YaHei" font-size="29" fill="#132F43">S1 传感数据与时间标记</text></g><g data-node="valid"><rect x="620" y="140" width="350" height="95" fill="#F0F5F8" stroke="#245B77" stroke-width="1.5"/><text x="635" y="197.5" font-family="Microsoft YaHei" font-size="29" fill="#132F43">S2 数据有效？</text></g><g data-node="state"><rect x="1130" y="140" width="390" height="95" fill="#F0F5F8" stroke="#245B77" stroke-width="1.5"/><text x="1145" y="197.5" font-family="Microsoft YaHei" font-size="29" fill="#132F43">S3 识别运行状态</text></g><g data-node="fault"><rect x="620" y="360" width="350" height="95" fill="#F0F5F8" stroke="#245B77" stroke-width="1.5"/><text x="635" y="417.5" font-family="Microsoft YaHei" font-size="29" fill="#132F43">S4 记录传感故障</text></g><g data-node="request"><rect x="1130" y="360" width="390" height="95" fill="#F0F5F8" stroke="#245B77" stroke-width="1.5"/><text x="1145" y="417.5" font-family="Microsoft YaHei" font-size="29" fill="#132F43">形成控制处理请求</text></g><g data-node="response"><rect x="1130" y="530" width="390" height="75" fill="#F0F5F8" stroke="#245B77" stroke-width="1.5"/><text x="1145" y="577.5" font-family="Microsoft YaHei" font-size="29" fill="#132F43">处理与恢复规则待验证</text></g><polyline data-source="input" data-target="valid" points="470,187.5 620,187.5" fill="none" stroke="#245B77" stroke-width="2" marker-end="url(#arrow)"/><polyline data-source="valid" data-target="state" points="970,187.5 1130,187.5" fill="none" stroke="#245B77" stroke-width="2" marker-end="url(#arrow)"/><text x="990" y="160" font-family="Microsoft YaHei" font-size="24" fill="#263D4A">有效</text><polyline data-source="valid" data-target="fault" points="795,235 795,360" fill="none" stroke="#245B77" stroke-width="2" marker-end="url(#arrow)"/><text x="650" y="300" font-family="Microsoft YaHei" font-size="24" fill="#263D4A">异常</text><polyline data-source="state" data-target="request" points="1325,235 1325,360" fill="none" stroke="#245B77" stroke-width="2" marker-end="url(#arrow)"/><polyline data-source="fault" data-target="request" points="970,407.5 1130,407.5" fill="none" stroke="#245B77" stroke-width="2" marker-end="url(#arrow)"/><polyline data-source="request" data-target="response" points="1325,455 1325,530" fill="none" stroke="#245B77" stroke-width="2" marker-end="url(#arrow)"/><text x="80" y="428" font-family="Microsoft YaHei" font-size="24" fill="#263D4A">数据异常时保留故障记录。</text><text x="80" y="460" font-family="Microsoft YaHei" font-size="24" fill="#263D4A">请求的内容、接收接口和</text><text x="80" y="492" font-family="Microsoft YaHei" font-size="24" fill="#263D4A">设备动作仍需设计与试验。</text></svg>