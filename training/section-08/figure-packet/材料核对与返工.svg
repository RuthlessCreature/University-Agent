<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6" fill="#245B77"/></marker></defs><rect width="1600" height="700" fill="white"/><text x="80" y="55" font-family="Microsoft YaHei" font-size="34" fill="#132F43">启动材料核对与返工回路</text><text x="80" y="102" font-family="Microsoft YaHei" font-size="24" fill="#627681">评分规则、分配方案与权限需有材料依据；返回箭头表示修订后重新核对。</text><g data-node="records"><rect x="80" y="150" width="440" height="95" fill="#F0F5F8" stroke="#245B77" stroke-width="1.5"/><text x="95" y="207.5" font-family="Microsoft YaHei" font-size="29" fill="#132F43">预试材料与检查记录</text></g><g data-node="check"><rect x="650" y="150" width="400" height="95" fill="#F0F5F8" stroke="#245B77" stroke-width="1.5"/><text x="665" y="207.5" font-family="Microsoft YaHei" font-size="29" fill="#132F43">启动条件已核对？</text></g><g data-node="proceed"><rect x="1200" y="150" width="320" height="95" fill="#F0F5F8" stroke="#245B77" stroke-width="1.5"/><text x="1215" y="207.5" font-family="Microsoft YaHei" font-size="29" fill="#132F43">按已定方案实施</text></g><g data-node="revise"><rect x="650" y="450" width="400" height="95" fill="#F0F5F8" stroke="#245B77" stroke-width="1.5"/><text x="665" y="507.5" font-family="Microsoft YaHei" font-size="29" fill="#132F43">补材料／修订版本</text></g><polyline data-source="records" data-target="check" points="520,197.5 650,197.5" fill="none" stroke="#245B77" stroke-width="2" marker-end="url(#arrow)"/><polyline data-source="check" data-target="proceed" points="1050,197.5 1200,197.5" fill="none" stroke="#245B77" stroke-width="2" marker-end="url(#arrow)"/><text x="1080" y="190" font-family="Microsoft YaHei" font-size="24" fill="#263D4A">已确认</text><polyline data-source="check" data-target="revise" points="850,245 850,450" fill="none" stroke="#245B77" stroke-width="2" marker-end="url(#arrow)"/><text x="875" y="350" font-family="Microsoft YaHei" font-size="24" fill="#263D4A">尚未确认</text><polyline data-source="revise" data-target="records" points="650,497.5 300,497.5 300,245" fill="none" stroke="#245B77" stroke-width="2" marker-end="url(#arrow)"/><text x="80" y="485" font-family="Microsoft YaHei" font-size="24" fill="#263D4A">修订后再查</text><text x="1110" y="358" font-family="Microsoft YaHei" font-size="24" fill="#263D4A">核对材料：</text><text x="1110" y="390" font-family="Microsoft YaHei" font-size="24" fill="#263D4A">评分规则与试评记录、</text><text x="1110" y="422" font-family="Microsoft YaHei" font-size="24" fill="#263D4A">分配单位及样本依据、</text><text x="1110" y="454" font-family="Microsoft YaHei" font-size="24" fill="#263D4A">招募与数据权限。</text></svg>